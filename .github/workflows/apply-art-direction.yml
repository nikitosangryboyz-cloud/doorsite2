name: Apply art direction

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject visual system
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          if 'art-direction.css' not in html:
              html = html.replace('</head>', '  <link rel="stylesheet" href="art-direction.css?v=2">\n</head>', 1)

          if 'motion.css' not in html:
              html = html.replace('</head>', '  <link rel="stylesheet" href="motion.css?v=1">\n</head>', 1)

          if 'full-width-fix.css' not in html:
              html = html.replace('</head>', '  <link rel="stylesheet" href="full-width-fix.css?v=1">\n</head>', 1)

          if 'motion.js' not in html:
              html = html.replace('</body>', '  <script src="motion.js?v=1" defer></script>\n</body>', 1)

          p.write_text(html, encoding='utf-8')

      - name: Commit visual system wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Fix full-width section backgrounds"
            git push
          fi
