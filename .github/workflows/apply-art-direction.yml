name: Apply art direction

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject art direction stylesheet
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          marker = 'art-direction.css'
          if marker not in html:
              html = html.replace('</head>', '  <link rel="stylesheet" href="art-direction.css?v=1">\n</head>', 1)
              p.write_text(html, encoding='utf-8')

      - name: Commit injected stylesheet link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Load premium art direction stylesheet"
            git push
          fi
